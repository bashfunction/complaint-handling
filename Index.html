  <!-- ═══════════════════════════════════════════════════

  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-nano-blue via-nano-blue-light to-slate-800">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">

            <path d="M 15 65 L 15 32 C 15 18, 26 10, 42 10 C 58 10, 68 20, 68 35 L 68 65" stroke="#30f101" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Complaint Handling</h1>
        <p class="text-white/60 text-sm font-medium mt-1">Nanobank Syariah</p>
      </div>

      <!-- Card -->
      <div class="bg-white rounded-3xl shadow-2xl p-8">
        <h2 class="text-lg font-bold text-nano-blue mb-1">Selamat Datang</h2>
        <p class="text-sm text-slate-500 mb-6">Masukkan NIK dan Nama untuk masuk</p>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">NIK Karyawan</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">badge</span>
              <input type="text" id="login-nik" required autocomplete="off" placeholder="Contoh: 522102"
                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-nano-blue/20 focus:border-nano-blue bg-slate-50 transition-all" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">person</span>
              <input type="text" id="login-nama" required autocomplete="off" placeholder="Contoh: Bashir Hanafi"
                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-nano-blue/20 focus:border-nano-blue bg-slate-50 transition-all" />
            </div>
          </div>

          <div id="login-error" class="hidden flex items-center gap-2 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold">
            <span class="material-symbols-outlined text-base">error</span>
            <span id="login-error-msg"></span>
          </div>

          <button type="submit" id="login-btn"
            class="w-full btn-primary-nano py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-2">
            <span class="material-symbols-outlined text-base text-nano-green" id="login-btn-icon">login</span>
            <span id="login-btn-text">Masuk</span>
          </button>
        </form>
      </div>
      <p class="text-center text-white/40 text-xs mt-6">© 2024 Nanobank Syariah. All rights reserved.</p>
    </div>

          class="nav-btn nav-item-active w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl font-bold text-sm transition-all duration-200">

          <span class="nav-text whitespace-nowrap overflow-hidden">Input Complaint</span>
