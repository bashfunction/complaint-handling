<!-- ═══════════════════════════════════════════════
     VIEW: INPUT COMPLAINT
════════════════════════════════════════════════ -->

<!-- Section Title -->
<div class="flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-nano-blue flex items-center justify-center">
      <span class="material-symbols-outlined text-nano-green text-2xl">edit_note</span>
    </div>
    <div>
      <h2 class="text-base font-bold text-nano-blue">Form Input Complaint</h2>
      <p class="text-xs text-slate-500 font-medium">Isi data complaint nasabah dengan lengkap</p>
    </div>
  </div>
</div>

<form id="complaint-form" onsubmit="handleComplaintSubmit(event)" class="space-y-5">

  <!-- ─ Card 1: Kategori Complaint ──────────────────────── -->
  <div class="m3-card p-6 border-t-4 border-t-nano-blue">
    <h3 class="text-sm font-bold text-nano-blue mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined text-lg">category</span>
      Kategori Complaint
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <!-- Product Category -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">ProductCategory <span class="text-red-500">*</span></label>
        <select id="f-product-cat" required onchange="handleProductCatChange()"
          class="field-input">
          <option value="">-- Pilih --</option>
        </select>
      </div>

      <!-- Complaint Category -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">ComplaintCategory <span class="text-red-500">*</span></label>
        <select id="f-complaint-cat" required onchange="handleComplaintCatChange()"
          class="field-input" disabled>
          <option value="">-- Pilih ProductCategory dulu --</option>
        </select>
      </div>

      <!-- Sub Category -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Sub-Category <span class="text-red-500">*</span></label>
        <select id="f-sub-cat" required onchange="handleSubCatChange()"
          class="field-input" disabled>
          <option value="">-- Pilih ComplaintCategory dulu --</option>
        </select>
      </div>
    </div>

    <!-- Auto-filled fields row -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Code ID</label>
        <input type="text" id="f-code-id" readonly placeholder="Auto-filled"
          class="field-input field-auto-filled" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">SLA</label>
        <input type="text" id="f-sla" readonly placeholder="Auto-filled"
          class="field-input field-auto-filled" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Priority <span class="text-red-500">*</span></label>
        <select id="f-priority" required class="field-input">
          <option value="">-- Pilih Priority --</option>
          <option value="Low">Low</option>
          <option value="Normal">Normal</option>
          <option value="High">High</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">PIC</label>
        <input type="text" id="f-pic" readonly placeholder="Auto-filled"
          class="field-input field-auto-filled" />
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Classification</label>
        <input type="text" id="f-classification" readonly placeholder="Auto-filled"
          class="field-input field-auto-filled" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Reason</label>
        <input type="text" id="f-reason" readonly placeholder="Auto-filled"
          class="field-input field-auto-filled" />
      </div>
    </div>
    <!-- Email PIC -->
    <div class="mt-4">
      <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Email PIC <span class="text-red-500">*</span></label>
      <input type="email" id="f-email-pic" required placeholder="Email PIC"
        class="field-input field-auto-filled" />
    </div>
  </div>

  <!-- ─ Card 2: Data Nasabah ─────────────────────────────── -->
  <div class="m3-card p-6 border-t-4 border-t-slate-300">
    <h3 class="text-sm font-bold text-nano-blue mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined text-lg">person</span>
      Data Nasabah
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Name <span class="text-red-500">*</span></label>
        <input type="text" id="f-name" required placeholder="Nama lengkap nasabah"
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Account Number <span class="text-red-500">*</span></label>
        <input type="text" id="f-account-number" required placeholder="Nomor rekening"
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Email Address <span class="text-red-500">*</span></label>
        <input type="email" id="f-email" required placeholder="email@nasabah.com"
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Phone Number <span class="text-red-500">*</span></label>
        <input type="tel" id="f-phone" required placeholder="08xxxxxxxxxx"
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">ATM Card Number</label>
        <input type="text" id="f-atm-card" placeholder="Nomor kartu ATM/Debit"
          class="field-input" />
      </div>
    </div>
  </div>

  <!-- ─ Card 3: Detail Transaksi ─────────────────────────── -->
  <div class="m3-card p-6 border-t-4 border-t-slate-300">
    <h3 class="text-sm font-bold text-nano-blue mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined text-lg">receipt_long</span>
      Detail Transaksi
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Date Transaction <span class="text-red-500">*</span></label>
        <input type="date" id="f-date-trx" required
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Transaction Amount 1 <span class="text-red-500">*</span></label>
        <input type="number" id="f-amount1" required placeholder="0"
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Transaction Amount 2</label>
        <input type="number" id="f-amount2" placeholder="0"
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Destination Phone Number</label>
        <input type="tel" id="f-dest-phone" placeholder="Nomor HP tujuan transfer"
          class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Provider Name <span class="text-red-500">*</span></label>
        <input type="text" id="f-provider" required placeholder="Nama provider"
          class="field-input" />
      </div>
    </div>
  </div>

  <!-- ─ Card 4: Deskripsi ─────────────────────────────────── -->
  <div class="m3-card p-6 border-t-4 border-t-slate-300">
    <h3 class="text-sm font-bold text-nano-blue mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined text-lg">description</span>
      Description
    </h3>
    <textarea id="f-description" rows="4" placeholder="Tuliskan kronologi atau detail complaint nasabah..."
      class="field-input resize-none"></textarea>
  </div>

  <!-- ─ Action Buttons ───────────────────────────────────── -->
  <div class="flex items-center justify-end gap-3 pb-4">
    <button type="button" onclick="resetComplaintForm()"
      class="px-6 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-sm hover:bg-slate-100 transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-base">restart_alt</span>
      Reset
    </button>
    <button type="submit" id="complaint-submit-btn"
      class="btn-primary-nano px-8 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-md">
      <span class="material-symbols-outlined text-base text-nano-green">send</span>
      Submit & Kirim Email
    </button>
  </div>
</form>

<!-- ── Success Modal ───────────────────────────────────── -->
<div id="success-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="m3-card p-8 max-w-md w-full animate-scaleIn text-center">
    <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
      <span class="material-symbols-outlined text-4xl text-green-600">check_circle</span>
    </div>
    <h3 class="text-lg font-bold text-slate-800 mb-1">Complaint Berhasil Dibuat!</h3>
    <p class="text-sm text-slate-500 mb-4">Email notifikasi telah dikirimkan ke nasabah dan PIC.</p>
    <div class="bg-slate-50 rounded-xl p-4 mb-6">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Ticket ID</p>
      <p id="modal-ticket-id" class="text-xl font-mono font-extrabold text-nano-blue"></p>
    </div>
    <button onclick="closeSuccessModal()" class="btn-primary-nano w-full py-3 rounded-xl font-bold text-sm">
      Buat Complaint Baru
    </button>
  </div>
</div>
