<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

  /* Sidebar states */
  .sidebar-expanded  { width: 260px; }
  .sidebar-collapsed { width: 72px; }
  .sidebar-collapsed .nav-text { display: none !important; }
  .sidebar-collapsed #logo-full { display: none !important; }
  .sidebar-collapsed #logo-mini { display: block !important; }

  /* Nav active state */
  .nav-item-active {
    background-color: #002657;
    color: #30f101 !important;
    font-weight: 700;
  }
  .nav-item-active .material-symbols-outlined { color: #30f101 !important; }
  .nav-btn .material-symbols-outlined { transition: color 0.2s; }

  /* Primary button */
  .btn-primary-nano {
    background-color: #002657;
    color: #ffffff;
    transition: all 0.25s ease-in-out;
    position: relative;
    overflow: hidden;
  }
  .btn-primary-nano:hover {
    background-color: #001a3d;
    box-shadow: 0 0 14px rgba(48,241,1,0.35);
  }
  .btn-primary-nano::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background-color: #30f101;
  }
  .btn-primary-nano:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* Danger button */
  .btn-danger {
    background-color: #dc2626;
    color: #fff;
    transition: all 0.2s;
  }
  .btn-danger:hover { background-color: #b91c1c; }

  /* Card */
  .m3-card {
    border: 1px solid rgba(226,232,240,0.8);
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 4px 20px -2px rgba(0,38,87,0.05);
  }

  /* Modal */
  @keyframes modalScaleIn {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1)  translateY(0); }
  }
  .animate-scaleIn { animation: modalScaleIn 0.22s cubic-bezier(0.16,1,0.3,1) forwards; }

  /* Status chips */
  .chip-open     { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
  .chip-progress { background:#dbeafe; color:#1e40af; border:1px solid #bfdbfe; }
  .chip-closed   { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
  .chip-overdue  { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }

  /* Toast */
  .toast {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: 14px;
    font-size: 13px; font-weight: 600;
    pointer-events: all; min-width: 260px; max-width: 360px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    animation: slideInRight 0.3s ease forwards;
  }
  .toast-success { background:#002657; color:#fff; }
  .toast-error   { background:#dc2626; color:#fff; }
  .toast-info    { background:#0ea5e9; color:#fff; }
  @keyframes slideInRight {
    from { opacity:0; transform:translateX(60px); }
    to   { opacity:1; transform:translateX(0); }
  }
  @keyframes slideOutRight {
    from { opacity:1; transform:translateX(0); }
    to   { opacity:0; transform:translateX(60px); }
  }
  .toast-out { animation: slideOutRight 0.3s ease forwards; }

  /* Form field focus ring */
  .field-input {
    width:100%; padding:0.625rem 0.875rem;
    border:1.5px solid #e2e8f0; border-radius:10px;
    font-size:0.8125rem; font-weight:500;
    background:#fff; transition:all 0.18s;
    outline:none;
  }
  .field-input:focus { border-color:#002657; box-shadow:0 0 0 3px rgba(0,38,87,0.08); }
  .field-input:disabled { background:#f8fafc; color:#94a3b8; cursor:not-allowed; }

  /* Table */
  .data-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
  .data-table thead tr { background:#002657; color:#fff; }
  .data-table thead th { padding:10px 12px; text-align:left; font-weight:700; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; }
  .data-table tbody tr { border-bottom:1px solid #f1f5f9; transition:background 0.15s; }
  .data-table tbody tr:hover { background:#f8fafc; }
  .data-table tbody td { padding:10px 12px; font-weight:500; color:#334155; }

  /* Auto-filled fields visual cue (clean grey background) */
  .field-auto-filled { background:#f1f5f9 !important; border-color:#cbd5e1 !important; color:#334155 !important; font-weight:600 !important; }

  /* Spin animation */
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 0.8s linear infinite; }

  /* Anti copy */
  * { -webkit-user-select:none; -moz-user-select:none; user-select:none; }
  input,textarea,select { -webkit-user-select:text !important; user-select:text !important; }
</style>
